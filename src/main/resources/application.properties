spring.application.name=wallet-service
spring.threads.virtual.enabled=true
spring.mvc.problemdetails.enabled=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
# PostgreSQL's dialect, reading the server ending a connection (restart, failover) as a lost one.
spring.jpa.database-platform=com.ebravo.wallet.adapter.persistence.ShutdownAwarePostgreSQLDialect
# Fail closed: a token must name this service as audience. Override per environment if the IdP uses another id.
spring.security.oauth2.resourceserver.jwt.audiences=wallet-service
# One JSON object per line, in Elastic Common Schema, whatever runs the service.
logging.structured.format.console=ecs
# Actuator on a port of its own, reached by the platform alone (metrics, health); the probes stay on
# the application's port as /livez and /readyz, where orchestrators already call the service.
management.server.port=8081
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.add-additional-paths=true
# Without its database the service can serve no request, so it takes itself out of rotation;
# liveness leaves it out, since a restart cannot bring the database back.
management.endpoint.health.group.readiness.include=readinessState,db
# A database out of reach answers 503 in about two seconds, like a busy wallet, instead of holding
# the request for the pool's default 30. Validation is bounded too: by default it may add five.
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.validation-timeout=1000
# Graceful shutdown is Spring Boot's default: the server stops accepting connections and waits for
# the requests in flight. Ten seconds cover the longest request the service bounds (key read 4 s,
# connection 2 s, posting budget 3 s), and end before the platform kills it (Compose waits 15 s).
spring.lifecycle.timeout-per-shutdown-phase=10s

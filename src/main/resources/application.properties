spring.application.name=wallet-service
spring.threads.virtual.enabled=true
spring.mvc.problemdetails.enabled=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
# Fail closed: a token must name this service as audience. Override per environment if the IdP uses another id.
spring.security.oauth2.resourceserver.jwt.audiences=wallet-service
# No lock wait is unbounded: a wallet locked longer than this fails fast with 503 instead of holding a thread.
spring.datasource.hikari.connection-init-sql=SET lock_timeout = '2s'

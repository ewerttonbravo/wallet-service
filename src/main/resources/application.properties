spring.application.name=wallet-service
spring.threads.virtual.enabled=true
spring.mvc.problemdetails.enabled=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
# Fail closed: a token must name this service as audience. Override per environment if the IdP uses another id.
spring.security.oauth2.resourceserver.jwt.audiences=wallet-service
# One JSON object per line, in Elastic Common Schema, whatever runs the service.
logging.structured.format.console=ecs
# Actuator on a port of its own, reached by the platform alone (metrics, health); the probes stay on
# the application's port as /livez and /readyz, where orchestrators already call the service.
management.server.port=8081
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.add-additional-paths=true

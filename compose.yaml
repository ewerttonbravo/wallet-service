name: wallet-service

services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet # local-only throwaway credential
    ports:
      - "127.0.0.1:5432:5432" # loopback only: the database is reachable from this machine alone
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 2s
      retries: 15

  issuer:
    image: ghcr.io/navikt/mock-oauth2-server:6.1.1
    ports:
      - "127.0.0.1:9000:8080" # loopback only, since it issues tokens to anyone; 8080 is taken by the service
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/local/.well-known/openid-configuration"]
      interval: 2s
      retries: 15

  wallet-service:
    build: .
    # The API drains requests in flight for up to 10 s and its server stops in about 12; the
    # management server drains after it. Docker's default of 10 s would kill the service mid-drain.
    stop_grace_period: 20s
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/wallet
      SPRING_DATASOURCE_USERNAME: wallet
      SPRING_DATASOURCE_PASSWORD: wallet # local-only throwaway credential
      # Tokens name their issuer by the address the client used, so the trusted issuer is the one
      # clients reach on this machine; the keys are fetched over the Compose network.
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUERURI: http://localhost:9000/local
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI: http://issuer:8080/local/jwks
    ports:
      - "127.0.0.1:8080:8080" # loopback only
    depends_on:
      postgres:
        condition: service_healthy
      issuer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/readyz"]
      start_period: 60s # failures in this window do not count; healthy as soon as it answers
      interval: 2s
      retries: 15

name: wallet-service

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet # local-only throwaway credential
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 2s
      retries: 15

  issuer:
    image: ghcr.io/navikt/mock-oauth2-server:6.1.1
    ports:
      - "9000:8080" # 8080 is taken by the service itself
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/local/.well-known/openid-configuration"]
      interval: 2s
      retries: 15
